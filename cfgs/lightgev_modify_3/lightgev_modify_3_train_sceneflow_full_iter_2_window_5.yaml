DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING: ./data/SceneFlow/sceneflow_train_npz.txt,
                EVALUATING: ./data/SceneFlow/sceneflow_val_npz.txt,
                TESTING: ./data/SceneFlow/sceneflow_test_npz.txt
            }
            RETURN_RIGHT_DISP: false
            CLEANPASS: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 384, 640 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: InputPadder, DIVIS_BY: 32, MODE: sintel }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: InputPadder, DIVIS_BY: 32, MODE: sintel }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

MODEL:
    NAME: LightGEVModify_3
    MAX_DISP: 192
    BACKBONE: MobileNetv2
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [4, 8, 16]
    LEFT_ATT: true

    GEV_CHANNELS: 16
    # dilation branch 당 채널 수 (dilation 개수와 무관하게 고정)
    GEV_BRANCH_CH: 5
    GEV_HIDDEN_DIM: 32
    GEV_ITERS: 2     # GRU step 수

    USE_GEV: true
    USE_GEO_COST_GATE: true
    USE_GEV_REFINER: true

    # refiner 가 매 iteration 현재 disparity 주변 창을 cost volume 에서 샘플링한다.
    # false 면 cost volume 전체를 루프 밖에서 한 번만 사영하는 예전 동작.
    GEV_LOOKUP: true
    GEV_LOOKUP_WINDOW: 5   # 홀수
    # disp 를 MAX_DISP/4 로 나눠 [0,1] 로 GRU 에 넣는다 (입력 3갈래 크기 균형)
    GEV_DISP_NORM: true
    # GRU 의 3x3 conv 를 depthwise-separable 로 (경량화)
    GEV_GRU_DW: true
    # 절대 disparity 갈래 사용 여부. false 면 D축 shift-equivariance 가 완성된다.
    GEV_USE_DISP_EMB: true

    # bounded multiplicative gate: gwc * (1 + r * tanh(gate_head(G)))
    # r 은 학습하지 않는 고정 하이퍼파라미터. 0 < r < 1 이어야 곱수가 항상 양수여서
    # gate 가 correlation 의 부호를 뒤집을 수 없다 (correlation 의 30~36% 가 음수).
    GEV_GATE_RANGE: 0.5
    # L2 정규화 여부
    GEV_GATE_NORM: true
    # gate_head 의 bias 사용 여부
    GEV_GATE_BIAS: false

    USE_CONTEXT_UP: true

    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: false
    AMP: true
    BATCH_SIZE_PER_GPU: 12
    NUM_EPOCHS: 90

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0004
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: 12
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 90
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 3
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: False
    EVAL_VISUALIZATION: False