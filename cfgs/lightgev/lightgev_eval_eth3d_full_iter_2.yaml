DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: ETH3DDataset
            DATA_SPLIT: {
                EVALUATING: ./data/ETH3D/eth3d_test.txt,
                TESTING: ./data/ETH3D/eth3d_test.txt
            }

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 384, 640 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 489, 942 ] }
            - { NAME: InputPadder, DIVIS_BY: 32, MODE: sintel }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: RightTopPad, SIZE: [ 489, 942 ] }
            - { NAME: InputPadder, DIVIS_BY: 32, MODE: sintel }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

MODEL:
    NAME: LightGEV
    MAX_DISP: 192
    BACKBONE: MobileNetv2
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [4, 8, 16]
    LEFT_ATT: true
    GEV_CHANNELS: 16
    GEV_HIDDEN_DIM: 32
    GEV_ITERS: 2

    USE_CONTEXT_UP: true

    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: false
    AMP: true
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 15

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0003
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 2
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 999
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: False
    EVAL_VISUALIZATION: False